<script>
let LD=0,LDT=null;
function ldOn(){LD++;if(LD==1){clearTimeout(LDT);LDT=setTimeout(()=>{const e=document.getElementById('ldr');if(e)e.classList.remove('hidden')},150)}}

function msg(t,ty){t=String(t==null?'':t);ty=ty||(/gagal|tidak berhasil|error|ditolak|salah/i.test(t)?'err':/berhasil|diunduh|diimpor|disimpan|dihapus|diupdate/i.test(t)?'ok':'');
let d=document.getElementById('toast');if(!d){d=document.createElement('div');d.id='toast';document.body.appendChild(d)}
const col=ty=='ok'?'#16a34a':ty=='err'?'#dc2626':'#1e293b',ic=ty=='ok'?'fa-circle-check':ty=='err'?'fa-circle-exclamation':'fa-circle-info';
d.style.cssText='position:fixed;left:50%;top:16px;transform:translateX(-50%);background:'+col+';color:#fff;padding:12px 18px;border-radius:10px;z-index:100001;max-width:92%;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.25);display:block';
d.innerHTML='<i class="fa '+ic+'" style="margin-right:8px"></i>'+String(t).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
clearTimeout(d._t);d._t=setTimeout(()=>d.style.display='none',ty=='ok'?3500:6500)}
function sukses(t){msg(t,'ok')}function gagal(t){msg(t,'err')}
let _ask=null;function ask(t,fn,c){_ask=fn;openM(`<p class="mb-4">${esc(t)}</p><div class="flex gap-2"><button onclick="closeM()" class="flex-1 bg-slate-400 text-white py-2 rounded">Batal</button><button onclick="closeM();_ask()" class="flex-1 bg-${c||'red'}-600 text-white py-2 rounded">Ya, lanjutkan</button></div>`)}
const $=i=>document.getElementById(i),
rn=(f,a,q)=>{if(!q)ldOn();return new Promise((ok,no)=>google.script.run.withSuccessHandler(v=>{if(!q)ldOff();ok(v)}).withFailureHandler(e=>{if(!q){ldOff();gagal((e&&e.message)||e)}no(e)})[f](...a))},
run=(f,...a)=>rn(f,a,0),runq=(f,...a)=>rn(f,a,1),
esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),
mth=s=>s.replace(/\^\{([^{}]+)\}|\^(-?\d+|[A-Za-z])/g,(m,a,b)=>'<sup>'+(a||b)+'</sup>').replace(/_\{([^{}]+)\}/g,'<sub>$1</sub>').replace(/([√∛])\{([^{}]+)\}/g,'<span class="sq">$1<span class="rd">$2</span></span>').replace(/\{\s*([^{}\/]+?)\s*\/\s*([^{}\/]+?)\s*\}/g,'<span class="fr"><span>$1</span><span>$2</span></span>'),
fmt=s=>mth(esc(s)).replace(/\*\*([^\s*](?:[^*]*[^\s*])?)\*\*/g,'<b>$1</b>').replace(/\*([^\s*](?:[^*]*[^\s*])?)\*/g,'<i>$1</i>'),
isImg=s=>/^https?:[/][/]/i.test(String(s||'').trim()),
gid=u=>{const m=String(u||'').match(/[?&]id=([\w-]+)|\/d\/([\w-]+)/);return m?(m[1]||m[2]):''},
FBD={},
fb=el=>{const id=gid(el.dataset.u);if(!id||FBD[id]===0||el.src.indexOf('data:')==0)return;
 google.script.run.withSuccessHandler(d=>{FBD[id]=d;document.querySelectorAll('img').forEach(i=>{if(gid(i.dataset.u)==id)i.src=d})}).withFailureHandler(()=>{FBD[id]=0}).getImg(id)},
im=u=>{if(!u)return'';const id=gid(u);return `<img src="${esc(FBD[id]||u)}" data-u="${esc(u)}" onerror="fb(this)" class="max-w-full rounded my-2 max-h-72 cursor-zoom-in" title="Klik untuk memperbesar" onclick="event.preventDefault();event.stopPropagation();pv(this)">`},
opt=v=>{const s=String(v==null?'':v).trim();if(isImg(s))return im(s);const l=s.split('\n'),last=(l[l.length-1]||'').trim();if(l.length>1&&isImg(last))return fmt(l.slice(0,-1).join('\n'))+im(last);return fmt(s)},
show=id=>['boot','login','tib','exam','admin','pg-done'].forEach(x=>$(x).classList.toggle('hidden',x!=id)),
closeM=()=>$('modal').classList.add('hidden'),
openM=(h,w)=>{$('mbox').className='bg-white rounded-xl w-full '+(w||'max-w-3xl')+' p-5 my-4';$('mbox').innerHTML=h;$('modal').classList.remove('hidden')};
// Preview gambar layar penuh + tombol tutup
function pv(el){closePv();const o=document.createElement('div');o.id='pvo';o.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px';
 o.innerHTML='<button type="button" style="position:absolute;top:12px;right:12px;background:#dc2626;color:#fff;border:0;border-radius:8px;padding:10px 16px;font-weight:700;font-size:15px;cursor:pointer" onclick="closePv()">\u2715 Tutup Gambar</button>';
 const i=document.createElement('img');i.src=el.currentSrc||el.src;i.style.cssText='max-width:100%;max-height:100%;object-fit:contain;background:#fff;border-radius:6px';
 o.appendChild(i);o.onclick=e=>{if(e.target!==i)closePv()};document.body.appendChild(o)}
function closePv(){const o=document.getElementById('pvo');if(o)o.remove()}
document.addEventListener('keydown',e=>{if(e.key=='Escape')closePv()});
let PW='',ST={},ROLE='siswa',TMR=null,CFG={judul:'CBT - SD Negeri 5 Wonosobo',subjudul:'Computer Based Test',logo:''};
try{const c0=JSON.parse(localStorage.getItem('cbt_cfg')||'null');if(c0)CFG=c0}catch(e){}
function toHome(){closeM();try{stopAuto();clearInterval(SAVT)}catch(e){}clearInterval(TMR);ST={};PW='';localStorage.removeItem('cbt_last');localStorage.removeItem('cbt_sess');try{sessionStorage.removeItem('cbt_admin')}catch(e){}['nama','token','pw'].forEach(i=>$(i).value='');$('err').textContent='';show('login');setRole('siswa')}
function applyCfg(c){try{localStorage.setItem('cbt_cfg',JSON.stringify({judul:c.judul,subjudul:c.subjudul,logo:c.logo,judul_admin:c.judul_admin,subjudul_admin:c.subjudul_admin}))}catch(e){}const adm=$('admin')&&!$('admin').classList.contains('hidden');document.title=adm?(c.judul_admin||'Admin CBT'):c.judul;const at=$('adm-title'),as=$('adm-sub');if(at)at.textContent=c.judul_admin||'Admin CBT';if(as)as.textContent=c.subjudul_admin==null?'':c.subjudul_admin;$('lg-title').textContent=c.judul;$('lg-sub').textContent=c.subjudul==null?'Computer Based Test':c.subjudul;document.querySelectorAll('.lgi').forEach(i=>{if(c.logo){i.dataset.u=c.logo;i.onerror=()=>fb(i);i.src=FBD[gid(c.logo)]||c.logo;i.classList.remove('hidden')}else i.classList.add('hidden')})}
applyCfg(CFG);
try{google.script.run.withSuccessHandler(c=>{CFG=c;applyCfg(c)}).getSettings()}catch(e){}

function setRole(r){ROLE=r;$('f-siswa').classList.toggle('hidden',r!='siswa');$('f-admin').classList.toggle('hidden',r!='admin');
['siswa','admin'].forEach(x=>$('t-'+x).className='flex-1 py-2 font-semibold '+(x==r?'tab-on':'tab-off'));$('err').textContent=''}
setRole('siswa');

function enterAdmin(p,pg){PW=p;try{sessionStorage.setItem('cbt_admin',JSON.stringify({pw:p,p:pg||'dash'}))}catch(e){}show('admin');buildMenu();applyCfg(CFG);nav(pg||'dash')}
async function doLogin(){
$('err').textContent='';
if(typeof google==='undefined'||!google.script){$('err').textContent='Buka halaman lewat URL Web App Apps Script (berakhiran /exec), bukan dari file atau pratinjau.';return}
if(ROLE=='admin'){const p=$('pw').value;if(await run('verifyAdminLogin',p))enterAdmin(p,'dash');else $('err').textContent='Password salah.';return}
await enterStudent($('nama').value,$('token').value,false)}
async function enterStudent(nama,token,auto){
let r;try{r=await run('verifyStudentLogin',nama,token)}catch(e){if(auto)show('login');return}
if(!r.ok){if(auto){localStorage.removeItem('cbt_sess');show('login')}else $('err').textContent=r.msg;return}
ST={nama:r.nama,kelas:r.kelas,token:r.token,paket:r.paket,judul:r.judul,q:[],i:0,ans:{},ragu:{},viol:0,end:0,active:false,prog:r.progres||null,sending:false};
localStorage.setItem('cbt_last',JSON.stringify({n:nama,t:token}));localStorage.setItem('cbt_sess',JSON.stringify({n:nama,t:token}));
if(r.resume&&(localStorage.getItem(K())||r.progres)){try{await startExam(true)}catch(e){show('login')}return}localStorage.removeItem(K());
$('tib-info').textContent=`${r.paket.nama} \u2022 ${r.paket.durasi} menit`;
$('tib-list').innerHTML=r.tib.map(t=>`<li>${esc(t)}</li>`).join('');show('tib');
}
const K=()=>'cbt_'+ST.nama+'_'+ST.token;
// Sisa waktu (detik) disimpan, bukan jam berakhir: timer berhenti saat halaman/jendela ditutup dan dilanjutkan dari sisa terakhir saat login lagi.
const sisa=()=>Math.max(0,Math.round((ST.end-Date.now())/1000));
const lsv=()=>{try{localStorage.setItem(K(),JSON.stringify({a:ST.ans,r:ST.ragu,v:ST.viol,L:sisa(),i:ST.i,ts:Date.now()}))}catch(e){}};
const sv=()=>{lsv();saveSoon()};
let SAVT=null,SVD=null;
function svInd(t,c){const e=$('svst');if(e){e.textContent=t;e.style.color=c||'#64748b'}}
function saveSrv(){if(!ST.active||!ST.token)return;const a=Object.assign({},ST.ans,{__ragu:ST.ragu,__i:ST.i});svInd('Menyimpan...');
 try{google.script.run.withSuccessHandler(ok=>{if(!ST.active)return;if(ok===false){ST.fz=(ST.fz||0)+1;if(ST.fz>=2)endedByAdmin();return}ST.fz=0;svInd('Tersimpan '+new Date().toLocaleTimeString('id-ID'),'#16a34a')}).withFailureHandler(()=>svInd('Offline: tersimpan di perangkat ini','#d97706')).saveProgress(ST.nama,ST.token,a,sisa(),ST.viol)}catch(e){}}
const saveSoon=()=>{clearTimeout(SVD);SVD=setTimeout(saveSrv,600)};
function endedByAdmin(){clearInterval(TMR);clearInterval(SAVT);clearTimeout(SVD);ST.active=false;try{localStorage.removeItem(K());localStorage.removeItem('cbt_sess')}catch(e){}
 openM(`<div class="text-center"><i class="fa fa-circle-info text-5xl text-amber-500"></i><h3 class="font-bold text-lg my-2">Ujian Diakhiri</h3><p>Ujian Anda telah direset atau diselesaikan oleh pengawas/guru. Silakan masuk kembali bila diminta.</p><button onclick="toHome()" class="mt-4 bg-blue-600 text-white px-6 py-2 rounded">Kembali ke Beranda</button></div>`)}
window.addEventListener('pagehide',()=>{if(ST.active){lsv();saveSrv()}});window.addEventListener('beforeunload',()=>{if(ST.active){lsv();saveSrv()}});

async function startExam(resume){
let raw;try{raw=await run('getQuestionsForStudent',ST.token)}catch(e){show('login');return}
try{ST.q=typeof raw==='string'?JSON.parse(raw):raw}catch(e){ST.q=null}
if(!Array.isArray(ST.q)||!ST.q.length){msg('Soal tidak berhasil dimuat. Hubungi guru/pengawas.');show('login');return}
const d=JSON.parse(localStorage.getItem(K())||'null'),sp=resume?ST.prog:null,cl=i=>Math.min(Math.max(Number(i)||0,0),ST.q.length-1);
// Pulihkan: sisa waktu = yang terkecil antara perangkat ini dan server; jawaban = yang paling baru disimpan.
const cand=[];
if(d)cand.push(d.L!=null?Number(d.L):(d.e?Math.max(0,Math.round((d.e-Date.now())/1000)):NaN));
if(sp&&sp.sisa!=null)cand.push(Number(sp.sisa));
const okc=cand.filter(x=>!isNaN(x));
let left0=okc.length?Math.min(...okc):ST.paket.durasi*60;
const useSrv=!!sp&&(!d||(Number(sp.t)||0)>(Number(d.ts)||0));
if(useSrv){const j=Object.assign({},sp.jawaban||{});ST.ragu=j.__ragu||{};ST.i=cl(j.__i);delete j.__ragu;delete j.__i;ST.ans=j;ST.viol=sp.viol||0}
else if(d){ST.ans=d.a||{};ST.ragu=d.r||{};ST.viol=d.v||0;ST.i=cl(d.i)}
const pulih=!!(resume&&(d||sp));
ST.end=Date.now()+Math.max(0,left0)*1000;
lsv();ST.active=true;saveSrv();clearInterval(SAVT);SAVT=setInterval(saveSrv,10000);show('exam');
$('x-title').textContent=ST.judul+' - '+ST.paket.mapel;$('x-nama').textContent=ST.nama+' ('+ST.kelas+')';
draw();clearInterval(TMR);TMR=setInterval(tick,1000);tick();
if(pulih)sukses('Jawaban terakhir dipulihkan. Sisa waktu '+fmtT(left0)+'.');
}
function tick(){const s=Math.max(0,Math.round((ST.end-Date.now())/1000));
$('timer').innerHTML=`<i class="fa fa-clock"></i> ${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
if(ST.active)lsv();
if(s<=0){clearInterval(TMR);doSubmit()}}
const tgl=()=>{$('qpanel').classList.toggle('hidden');$('side').classList.toggle('hidden')};
const done=q=>{const a=ST.ans[q.ID_Soal];return Array.isArray(a)?a.some(Boolean):!!a};

async function imp(el){const f=el.files[0];el.value='';if(!f)return;

  const h=(rows[0]||[]).map(x=>String(x).toLowerCase().replace(/[\s_]/g,'')),hasH=h.some(x=>/^nama/.test(x)),ci=(re,d)=>hasH?h.findIndex(x=>re.test(x)):d;
  const iN=ci(/^nama/,0),iK=ci(/^kelas/,1),iA=ci(/^statusakun/,-1),S=(c,i)=>i<0||c[i]==null?'':String(c[i]).trim();

  if(!list.length)return msg('Tidak ada data siswa terbaca. Isi kolom Nama_Siswa dan Kelas mulai baris ke-2.');
  const r=await A('import',{list});msg(r.added+' siswa diimpor'+(r.skipped?', '+r.skipped+' dilewati (nama sudah ada/ganda)':'')+'.');nav('siswa')

 $('amain').innerHTML=H2('Live Score',pktSel(CURL,"CURL=this.value;liveLoad(true)")+`<select id="lk" class="!w-auto" onchange="KLL=this.value;liveDraw()"></select>`+BTN('<i class="fa fa-rotate"></i> Segarkan','liveLoad(true)','slate'))+
 `<p class="text-xs text-slate-500 mb-3">Nilai sementara dihitung langsung dari jawaban yang sudah tersimpan. <span id="lt"></span></p><div id="lvb"></div>`;
 await liveLoad(true);clearInterval(AUTO);AUTO=setInterval(()=>liveLoad(false),10000)};
async function liveLoad(loud){if(CUR!='live')return;try{const r=await (loud?A:Aq)('pantau',{v:CURL});if(CUR!='live'||r.paket!=CURL)return;D.lv=r;liveDraw()}catch(e){}}
function liveDraw(){const r=D.lv;if(!r||CUR!='live'||!$('lvb'))return;
 fillSel('lk',[...new Set(r.rows.map(x=>x.Kelas))].sort(),KLL,'Semua kelas');
 const rs=r.rows.filter(x=>!KLL||x.Kelas==KLL),tot=rs.length,sl=rs.filter(x=>x.Status=='Selesai').length,sd=rs.filter(x=>x.Status=='Sedang Mengerjakan').length,bl=tot-sl-sd;
 const act=rs.filter(x=>x.Status!='Belum Mulai').sort((a,b)=>Number(b.Nilai)-Number(a.Nilai)||b.Dijawab-a.Dijawab||String(a.Nama_Siswa).localeCompare(String(b.Nama_Siswa)));
 const avg=act.length?Math.round(act.reduce((s,x)=>s+Number(x.Nilai||0),0)/act.length*100)/100:0;
 let rk=0,pv=null;act.forEach((x,i)=>{if(x.Nilai!==pv){rk=i+1;pv=x.Nilai}x._rank=rk});
 const bar=(l,v,c)=>`<div class="flex items-center gap-2 mb-2"><div class="text-sm" style="width:9rem">${l}</div><div class="flex-1 bg-slate-100 rounded overflow-hidden" style="height:24px"><div class="${c} rounded" style="height:24px;width:${tot?v/tot*100:0}%;min-width:${v?'6px':'0'};transition:width .6s"></div></div><div class="text-right font-bold" style="width:2.5rem">${v}</div></div>`;
 const rows=act.map(x=>({x,rank:x._rank})).concat(rs.filter(x=>x.Status=='Belum Mulai').sort((a,b)=>String(a.Nama_Siswa).localeCompare(String(b.Nama_Siswa))).map(x=>({x,rank:'-'})));
 $('lt').textContent='Diperbarui '+new Date().toLocaleTimeString('id-ID')+' • otomatis tiap 10 detik';
 $('lvb').innerHTML=`<div class="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-4">${card('Total Peserta',tot,'users','slate')+card('Selesai',sl,'circle-check','green')+card('Sedang Mengerjakan',sd,'pen','blue')+card('Rata-rata Nilai',avg,'chart-simple','amber')}</div>
 <div class="grid lg:grid-cols-2 gap-4 mb-4"><div class="bg-white rounded shadow p-4"><h3 class="font-bold mb-3">Grafik Peserta</h3>${bar('Total Peserta',tot,'bg-slate-500')+bar('Selesai',sl,'bg-green-600')+bar('Sedang Mengerjakan',sd,'bg-blue-600')+bar('Belum Mulai',bl,'bg-amber-400')}</div>
 <div class="bg-white rounded shadow p-4 flex flex-col items-center"><h3 class="font-bold mb-3">Rata-rata Nilai</h3><div style="width:150px;height:150px;border-radius:50%;background:conic-gradient(#2563eb ${Math.min(100,avg)*3.6}deg,#e2e8f0 0);display:flex;align-items:center;justify-content:center"><div style="width:108px;height:108px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700">${avg}</div></div><p class="text-xs text-slate-500 mt-2">dari ${act.length} siswa yang sudah mulai</p></div></div>
 <h3 class="font-bold mb-2">Peringkat</h3><div class="overflow-auto bg-white rounded shadow"><table class="w-full text-sm"><tr class="bg-slate-100 text-left"><th class="p-2 w-16">Rank</th><th class="p-2">Nama Siswa</th><th class="p-2">Kelas</th><th class="p-2">Nilai</th><th class="p-2">Status Ujian</th></tr>`+
 (rows.map(o=>`<tr class="border-t"><td class="p-2 font-bold">${o.rank<=3&&o.rank!='-'?`<i class="fa fa-trophy ${o.rank==1?'text-yellow-500':o.rank==2?'text-slate-400':'text-amber-700'}"></i> `:''}${o.rank}</td><td class="p-2">${esc(o.x.Nama_Siswa)}</td><td class="p-2">${esc(o.x.Kelas)}</td><td class="p-2 font-bold ${o.x.Status=='Sedang Mengerjakan'?'text-slate-500 italic':''}">${o.x.Status=='Belum Mulai'?'-':o.x.Nilai}</td><td class="p-2">${BDG(o.x.Status)}</td></tr>`).join('')||`<tr><td class="p-4 text-slate-400" colspan="99">Belum ada peserta.</td></tr>`)+'</table></div>'}

 D.hasil=raw.filter(x=>{const k=nz(x.Nama_Siswa)+'|'+pn(x.Paket);if(sn.has(k))return false;sn.add(k);return true});D.dup=raw.length-D.hasil.length;D.pk=await A('list',{k:'paket'});
 const mp={};D.pk.forEach(p=>mp[String(p.Nama_Paket_Soal).trim()]=p.Mata_Pelajaran);D.hasil.forEach(x=>x.Mata_Pelajaran=mp[String(x.Paket).trim()]||'-');
 const kl=[...new Set(D.hasil.map(x=>x.Kelas))].sort(),mpl=[...new Set(D.pk.map(p=>p.Mata_Pelajaran).filter(Boolean))].sort();
 if(CURH&&!D.pk.some(p=>p.Nama_Paket_Soal==CURH))CURH='';

 `<div class="grid sm:grid-cols-3 gap-2 mb-3"><label class="text-sm font-semibold">Nama Paket Soal<select onchange="CURH=this.value;rekapDraw()"><option value="">Semua paket soal</option>${op(D.pk.map(p=>p.Nama_Paket_Soal),CURH)}</select></label>
 <label class="text-sm font-semibold">Kelas<select onchange="CURK=this.value;rekapDraw()"><option value="">Semua kelas</option>${op(kl,CURK)}</select></label>
 <label class="text-sm font-semibold">Mata Pelajaran<select onchange="CURMP=this.value;rekapDraw()"><option value="">Semua mata pelajaran</option>${op(mpl,CURMP)}</select></label></div>`+
 (D.dup?`<p class="text-xs text-amber-700 mb-2">Ada ${D.dup} baris ganda (siswa &amp; paket sama) di sheet. Tabel hanya menampilkan yang terbaru; tombol kuning menghapusnya dari sheet.</p>`:'')+'<div id="rk"></div>';rekapDraw()};
function rekapDraw(){const rs=fh(),n=rs.map(x=>Number(x.Nilai_Akhir)||0),avg=n.length?Math.round(n.reduce((a,b)=>a+b,0)/n.length*100)/100:0;
 $('rk').innerHTML=`<div class="grid grid-cols-2 md:grid-cols-4 gap-2 mb-3">${card('Jumlah Data',rs.length,'list','slate')+card('Rata-rata',avg,'chart-simple','blue')+card('Tertinggi',n.length?Math.max(...n):'-','arrow-up','green')+card('Terendah',n.length?Math.min(...n):'-','arrow-down','red')}</div>`+T(RKC,rs,null,{no:1})}

function printHTML(title,body){const f=document.createElement('iframe');f.style.cssText='position:fixed;right:0;bottom:0;width:0;height:0;border:0';document.body.appendChild(f);
 const d=f.contentWindow.document;d.open();d.write(`<!doctype html><html><head><meta charset="utf-8"><title>${esc(title)}</title><style>body{font-family:Arial,sans-serif;font-size:12px;padding:16px;color:#111}h2{margin:0 0 2px}p{margin:2px 0}table{border-collapse:collapse;width:100%;margin-top:10px}th,td{border:1px solid #444;padding:4px 6px;text-align:left}th{background:#e5e7eb}</style></head><body>${body}</body></html>`);d.close();
 setTimeout(()=>{try{f.contentWindow.focus();f.contentWindow.print()}catch(e){gagal('Cetak gagal: '+e.message)}setTimeout(()=>f.remove(),3000)},500)}
function cetakRekap(){const rs=fh();if(!rs.length)return gagal('Tidak ada data untuk dicetak.');
 printHTML('Rekap Nilai',`<h2>${esc(CFG.judul)}</h2><p><b>Rekapitulasi Nilai</b></p><p>${esc(rkInfo())}</p><p>Dicetak: ${new Date().toLocaleString('id-ID')}</p><table><tr><th>No</th><th>Nama Siswa</th><th>Kelas</th><th>Mata Pelajaran</th><th>Paket Soal</th><th>Nilai</th><th>Benar</th><th>Salah</th><th>Pelanggaran</th><th>Waktu</th></tr>${rs.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.Nama_Siswa)}</td><td>${esc(x.Kelas)}</td><td>${esc(x.Mata_Pelajaran)}</td><td>${esc(x.Paket)}</td><td>${esc(x.Nilai_Akhir)}</td><td>${esc(x.Total_Benar)}</td><td>${esc(x.Total_Salah)}</td><td>${esc(x.Pelanggaran_Tab)}</td><td>${esc(x.Timestamp)}</td></tr>`).join('')}</table>`)}
let _pdf=null;const loadPdf=()=>_pdf||(_pdf=new Promise((ok,no)=>{const ld=u=>new Promise((o,n)=>{const s=document.createElement('script');s.src=u;s.onload=o;s.onerror=()=>n(new Error('x'));document.head.appendChild(s)});
 ld('https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js').then(()=>ld('https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js')).then(ok).catch(()=>{_pdf=null;no(new Error('Gagal memuat pustaka PDF. Cek koneksi internet atau gunakan tombol Cetak.'))})}));
